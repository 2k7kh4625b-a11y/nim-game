<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nim Game</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    background: #111;
    color: white;
}
.row {
    margin: 15px;
}
.stick {
    display: inline-block;
    width: 12px;
    height: 40px;
    margin: 3px;
    background: #4CAF50;
    border-radius: 3px;
}
.selected {
    background: #2196F3;
}
button {
    padding: 10px;
    margin: 10px;
    font-size: 16px;
}
</style>
</head>
<body>

<h2 id="status">Твой ход</h2>

<div id="game"></div>

<p>Убрать: <span id="count">1</span></p>
<input type="range" min="1" max="3" value="1" id="slider">

<br>
<button onclick="makeMove()">Сделать ход</button>
<button onclick="resetGame()">Новая игра</button>

<script>
let rows = [3,5,7];
let selectedRow = null;

function render() {
    const game = document.getElementById("game");
    game.innerHTML = "";
    
    rows.forEach((count, rowIndex) => {
        const div = document.createElement("div");
        div.className = "row";
        
        for (let i = 0; i < count; i++) {
            const stick = document.createElement("div");
            stick.className = "stick";
            
            if (selectedRow === rowIndex) {
                stick.classList.add("selected");
            }
            
            stick.onclick = () => selectRow(rowIndex);
            div.appendChild(stick);
        }
        
        game.appendChild(div);
    });
}

function selectRow(row) {
    if (rows[row] > 0) {
        selectedRow = row;
        render();
    }
}

function makeMove() {
    if (selectedRow === null) return;
    
    let count = parseInt(document.getElementById("slider").value);
    count = Math.min(count, rows[selectedRow]);
    
    rows[selectedRow] -= count;
    
    if (checkGameOver("Ты проиграл 😢")) return;
    
    document.getElementById("status").innerText = "Ход компьютера...";
    
    setTimeout(aiMove, 700);
}

function aiMove() {
    let xor = rows.reduce((a,b)=>a^b,0);
    
    for (let i=0;i<rows.length;i++) {
        for (let r=1;r<=3;r++) {
            if (rows[i] >= r) {
                let temp = [...rows];
                temp[i] -= r;
                if (temp.reduce((a,b)=>a^b,0) === 0) {
                    rows[i] -= r;
                    if (checkGameOver("Ты выиграл 🎉")) return;
                    document.getElementById("status").innerText = "Твой ход";
                    render();
                    return;
                }
            }
        }
    }
    
    // случайный ход
    let available = rows.map((v,i)=>v>0?i:null).filter(v=>v!==null);
    let row = available[Math.floor(Math.random()*available.length)];
    let remove = Math.min(3, rows[row]);
    
    rows[row] -= Math.ceil(Math.random()*remove);
    
    if (checkGameOver("Ты выиграл 🎉")) return;
    
    document.getElementById("status").innerText = "Твой ход";
    render();
}

function checkGameOver(text) {
    if (rows.reduce((a,b)=>a+b,0) === 0) {
        document.getElementById("status").innerText = text;
        return true;
    }
    render();
    return false;
}

function resetGame() {
    rows = [3,5,7];
    selectedRow = null;
    document.getElementById("status").innerText = "Твой ход";
    render();
}

document.getElementById("slider").oninput = function() {
    document.getElementById("count").innerText = this.value;
};

render();
</script>

</body>
</html>
